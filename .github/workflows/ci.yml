name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Lint Check (Compileall)
      run: |
        python -m compileall -q .

    - name: AST Integrity & Invariants Verification
      run: |
        python tools/pipeline_conveyor.py --ast --invariants

    - name: Run Unit Tests with Discovery
      run: |
        python -m unittest discover -s tests

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build and validate distribution
      run: |
        python -m pip install --upgrade pip build twine
        python -m build
        python -m twine check dist/*

    - name: Verify wheel entry point and web assets
      run: |
        python -c "import glob, zipfile; wheel=glob.glob('dist/*.whl')[0]; names=set(zipfile.ZipFile(wheel).namelist()); required={'omnistitch_studio/index.html','omnistitch_studio/styles.css','omnistitch_studio/app.js','omnistitch_studio/frontend/matrix_utils.js','omnistitch_studio/frontend/project_store.js','omnistitch_studio/frontend/canvas_engine.js'}; missing=required-names; assert not missing, f'Missing wheel files: {sorted(missing)}'; assert any(name.endswith('.dist-info/entry_points.txt') for name in names), 'Missing console entry point'"
